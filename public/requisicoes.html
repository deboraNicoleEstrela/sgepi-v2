<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Requisições - SGEPI</title>
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light p-4">

  <!-- CONTAINER DE ALERTAS ESTILIZADOS -->
  <div id="alertContainer" class="position-fixed top-0 end-0 p-3" style="z-index: 1080; max-width: 400px;"></div>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <h2 class="fw-bold text-dark m-0">
        <i class="bi bi-shield-check text-primary me-2"></i>Portal do Colaborador
      </h2>
      <button class="btn btn-outline-danger fw-semibold" onclick="logout()">
        <i class="bi bi-box-arrow-right me-1"></i> Sair
      </button>
    </div>

    <div class="row g-4">
      <div class="col-md-4">
        <div class="card border-0 shadow-sm rounded-3">
          <div class="card-header bg-primary text-white p-3">
            <h5 class="card-title m-0 fs-6 fw-bold">
              <i class="bi bi-plus-circle me-2"></i>Requisitar EPI
            </h5>
          </div>
          <div class="card-body p-3">
            <form id="formReq">
              <div class="mb-3">
                <label for="epiSelect" class="form-label fw-semibold text-secondary">Selecione o Equipamento</label>
                <select id="epiSelect" class="form-select" required></select>
              </div>
              <div class="mb-3">
                <label for="descricao" class="form-label fw-semibold text-secondary">Motivo da Solicitação</label>
                <textarea id="descricao" class="form-control" rows="3" placeholder="Ex: Necessário para a atividade na tecelagem..." required maxlength="255"></textarea>
              </div>
              <button class="btn btn-primary w-100 fw-bold py-2" type="submit">
                <i class="bi bi-send-fill me-1"></i> Enviar Solicitação
              </button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-md-8">
        <div class="card border-0 shadow-sm rounded-3">
          <div class="card-header bg-white p-3 border-bottom-0">
            <h5 class="card-title m-0 fw-bold text-dark">
              <i class="bi bi-card-checklist text-primary me-2"></i>Minhas Solicitações
            </h5>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-dark">
                <tr>
                  <th>EPI</th>
                  <th>Tipo</th>
                  <th>Status</th>
                  <th class="text-center">Ação</th>
                </tr>
              </thead>
              <tbody id="tabelaReqs"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL ESTILIZADO PARA CONFIRMAÇÃO DE DEVOLUÇÃO -->
  <div class="modal fade" id="modalDevolucao" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-warning text-dark">
          <h5 class="modal-title fw-bold">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>Confirmar Devolução
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body p-4 text-center">
          <i class="bi bi-arrow-return-left text-warning display-3 d-block mb-3"></i>
          <p class="fs-6 mb-0 text-dark">Tem certeza de que deseja solicitar a **devolução** deste equipamento de proteção?</p>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary fw-semibold" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-warning fw-bold text-dark" id="btnConfirmarDevolucao">
            <i class="bi bi-check-circle me-1"></i> Confirmar Devolução
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- JS Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const user = JSON.parse(sessionStorage.getItem('usuarioLogado'));
    const token = sessionStorage.getItem('token');
    if(!user || user.perfil !== 'COMUM' || !token) window.location.href = 'login.html';

    const reqHeaders = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
    
    let epiIdDevolucao = null;
    let modalDevolucaoInst = null;

    document.addEventListener('DOMContentLoaded', () => {
      const elModalDev = document.getElementById('modalDevolucao');
      if (elModalDev) modalDevolucaoInst = new bootstrap.Modal(elModalDev);

      document.getElementById('btnConfirmarDevolucao')?.addEventListener('click', executarDevolucao);
      carregarDados();
    });

    // Função para exibir Alertas Flutuantes com as cores do site
    function exibirAlerta(mensagem, tipo = 'success') {
      const container = document.getElementById('alertContainer');
      if (!container) return;

      const alertDiv = document.createElement('div');
      alertDiv.className = `alert alert-${tipo} alert-dismissible fade show shadow-lg border-0 d-flex align-items-center mb-2`;
      alertDiv.role = 'alert';
      
      const icone = tipo === 'success' ? 'check-circle-fill' : (tipo === 'info' ? 'info-circle-fill' : 'exclamation-triangle-fill');
      
      alertDiv.innerHTML = `
        <i class="bi bi-${icone} fs-5 me-2"></i>
        <div>${mensagem}</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
      `;

      container.appendChild(alertDiv);

      setTimeout(() => {
        if (alertDiv) {
          const bsAlert = bootstrap.Alert.getInstance(alertDiv) || new bootstrap.Alert(alertDiv);
          bsAlert.close();
        }
      }, 5000);
    }

    async function carregarDados() {
  try {
    const resEpi = await fetch('/api/epis/disponiveis', { headers: reqHeaders });
    const epis = await resEpi.json();
    
    const selectEpi = document.getElementById('epiSelect');
    if (epis.length === 0) {
      selectEpi.innerHTML = '<option value="" disabled selected>Nenhum EPI disponível no momento</option>';
    } else {
      selectEpi.innerHTML = epis.map(e => `<option value="${e.id}">${e.nome} (CA: ${e.ca_numero})</option>`).join('');
    }

    const resReq = await fetch(`/api/requisicoes/usuario/${user.id}`, { headers: reqHeaders });
    const reqs = await resReq.json();

    // Notificação estilizada de aprovações
    const recemAprovadas = reqs.filter(r => r.status === 'APROVADA' && !r.notificado);
    if(recemAprovadas.length > 0) {
      exibirAlerta('<strong>Notificação:</strong> Você tem novas solicitações que foram aprovadas!', 'success');
      await fetch(`/api/requisicoes/notificar/${user.id}`, { method: 'PUT', headers: reqHeaders });
    }

    const tbody = document.getElementById('tabelaReqs');
    if (reqs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">Nenhuma solicitação realizada ainda.</td></tr>';
      return;
    }

    // Mapeia quais EPIs já possuem devolução PENDENTE ou APROVADA
    const episComDevolucaoSolicitadaOuConcluida = new Set(
      reqs
        .filter(r => r.tipo === 'DEVOLUCAO' && (r.status === 'PENDENTE' || r.status === 'APROVADA'))
        .map(r => r.epi_id)
    );

    tbody.innerHTML = reqs.map(r => {
      let badgeStatus = 'bg-warning text-dark';
      if (r.status === 'APROVADA') badgeStatus = 'bg-success';
      if (r.status === 'REJEITADA') badgeStatus = 'bg-danger';

      // O botão só aparece se a solicitação for de RETIRADA APROVADA e NÃO houver devolução em andamento ou concluída
      const podeDevolver = r.status === 'APROVADA' && 
                           r.tipo === 'RETIRADA' && 
                           !episComDevolucaoSolicitadaOuConcluida.has(r.epi_id);

      return `
        <tr>
          <td class="fw-semibold text-dark">${r.epi_nome}</td>
          <td><span class="badge bg-light text-dark border">${r.tipo}</span></td>
          <td><span class="badge ${badgeStatus}">${r.status}</span></td>
          <td class="text-center">
            ${podeDevolver 
              ? `<button class="btn btn-sm btn-outline-warning fw-bold" onclick="abrirModalDevoluacao(${r.epi_id})"><i class="bi bi-arrow-return-left me-1"></i> Devolver</button>` 
              : '<span class="text-muted small">-</span>'}
          </td>
        </tr>
      `;
    }).join('');
  } catch (erro) {
    console.error('Erro ao carregar dados:', erro);
    exibirAlerta('Erro ao atualizar os dados do servidor.', 'danger');
  }
}

    document.getElementById('formReq').onsubmit = async (e) => {
      e.preventDefault();
      const epi_id = document.getElementById('epiSelect').value;
      const descricao = document.getElementById('descricao').value.trim();

      if (!epi_id) {
        exibirAlerta('Selecione um EPI válido.', 'warning');
        return;
      }

      try {
        const res = await fetch('/api/requisicoes', {
          method: 'POST',
          headers: reqHeaders,
          body: JSON.stringify({ usuario_id: user.id, epi_id, tipo: 'RETIRADA', descricao })
        });

        if (res.ok) {
          exibirAlerta('Solicitação enviada com sucesso! Aguarde a análise do responsável.', 'success');
          document.getElementById('descricao').value = '';
          carregarDados();
        } else {
          exibirAlerta('Erro ao enviar solicitação.', 'danger');
        }
      } catch (erro) {
        exibirAlerta('Erro de conexão com o servidor.', 'danger');
      }
    };

    function abrirModalDevoluacao(epi_id) {
      epiIdDevolucao = epi_id;
      modalDevolucaoInst?.show();
    }

    async function executarDevolucao() {
      if(!epiIdDevolucao) return;

      try {
        const res = await fetch('/api/requisicoes', {
          method: 'POST',
          headers: reqHeaders,
          body: JSON.stringify({ usuario_id: user.id, epi_id: epiIdDevolucao, tipo: 'DEVOLUCAO', descricao: 'Devolução de EPI pelo colaborador' })
        });

        modalDevolucaoInst?.hide();

        if (res.ok) {
          exibirAlerta('Solicitação de devolução enviada com sucesso!', 'info');
          carregarDados();
        } else {
          exibirAlerta('Erro ao registrar solicitação de devolução.', 'danger');
        }
      } catch (erro) {
        modalDevolucaoInst?.hide();
        exibirAlerta('Erro de conexão com o servidor.', 'danger');
      }
    }

    function logout() { sessionStorage.clear(); window.location.href = 'login.html'; }
  </script>
</body>
</html>
